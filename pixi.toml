[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "spatial-bio-training"
description = "Python environment for Day 2 of the spatial biology workshop"
# No TensorFlow, so macOS (Apple Silicon) works too. win-64 and osx-arm64 run
# InstanSeg on CPU / Apple MPS; linux-64 picks up CUDA from the PyPI torch wheel.
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"
# pixi.lock uses lock-file format v7, which older pixi cannot read.
requires-pixi = ">=0.68"

[tasks]
check = { cmd = "python Scripts/check_install.py", description = "Check the workshop environment works" }
check-full = { cmd = "python Scripts/check_install.py --full", description = "Also download the InstanSeg model and segment a test image" }
lab = { cmd = "jupyter lab", description = "Start JupyterLab" }

[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
# Reading, segmenting and aggregating spatial data (InstanSeg via Sopa; pulls in PyTorch)
sopa = { version = ">=2.3.0,<3", extras = ["instanseg"] }
spatialdata = ">=0.8.0"
spatialdata-io = ">=0.7"
spatialdata-plot = ">=0.4.0"

# Single-cell and spatial analysis
scanpy = ">=1.12"
squidpy = ">=1.8.3"
networkx = ">=3.4,<4"
python-igraph = "*"

# Segmentation and transcript-assignment QC
segtraq = ">=0.0.7"

# Interactive viewing
napari = { version = ">=0.6", extras = ["all"] }
napari-spatialdata = ">=0.7"

# Notebooks
jupyterlab = ">=4"
ipykernel = "*"
ipywidgets = ">=8"
